name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Gate 1: formatting. Cheap, so it runs first and fails fast.
  format:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # Gate 2: NASA Rules 2 and 3 — bounded complexity, no panics in libraries.
  # The lint set is declared in the workspace manifest; this makes it fatal.
  clippy:
    name: clippy (-D warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # Gate 3: the test suite, including doctests, on every supported platform.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features

  # Gate 4: the declared MSRV must actually build.
  msrv:
    name: minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-features

  # Gate 5: NASA Rule 1 — `#![forbid(unsafe_code)]` is verified, not merely asserted.
  # Miri detects undefined behaviour that safe-looking code can still reach through
  # dependencies.
  miri:
    name: miri (undefined behaviour)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      - run: cargo miri test -p casm-core -p casm-parser

  # Gate 6: supply chain — licences, advisories, and duplicate dependencies.
  deny:
    name: cargo-deny (licences + advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # Gate 7: documentation must build with no broken intra-doc links.
  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --all-features

  # Gate 8: the VS Code client must typecheck. It is thin, but a broken client is the
  # first thing most users would meet.
  extension:
    name: vscode extension (tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: editors/vscode/package.json
      - run: npm install --no-audit --no-fund
        working-directory: editors/vscode
      - run: npx tsc -p ./ --noEmit
        working-directory: editors/vscode

  # Gate 9: CASIMIR validates its own example architectures. If the tool cannot keep
  # its own house in order, it has no business auditing anyone else's.
  dogfood:
    name: dogfood (casm check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -p casm-cli -- check examples --strict
