name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Gate 1: formatting. Cheap, so it runs first and fails fast.
  format:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # Gate 2: NASA Rules 2 and 3 — bounded complexity, no panics in libraries.
  # The lint set is declared in the workspace manifest; this makes it fatal.
  clippy:
    name: clippy (-D warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # Gate 3: the test suite, including doctests, on every supported platform.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features

  # Gate 4: the declared MSRV must actually build.
  msrv:
    name: minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-features

  # Gate 5: NASA Rule 1. Every crate is `#![forbid(unsafe_code)]`, so the compiler already
  # guarantees CASIMIR contains none; what Miri adds is detecting undefined behaviour
  # reached *through dependencies* — `uuid`, `sha3`, `indexmap`, and `serde` all have
  # unsafe internals.
  #
  # Scoped to `casm-core`: it is where those primitives are exercised, and Miri runs
  # roughly a hundred times slower than native, so the whole workspace would take longer
  # than every other gate combined.
  miri:
    name: miri (undefined behaviour)
    runs-on: ubuntu-latest
    env:
      # Isolation blocks `getcwd`, which `proptest` calls to locate its regression file.
      # Miri is being used here to find UB, not to sandbox.
      MIRIFLAGS: -Zmiri-disable-isolation
      # 256 cases per property is right for a native run and disproportionate under Miri.
      PROPTEST_CASES: 4
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      - run: cargo miri test -p casm-core --lib

  # Gate 6: supply chain — licences, advisories, and duplicate dependencies.
  deny:
    name: cargo-deny (licences + advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # Gate 7: documentation must build with no broken intra-doc links.
  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --all-features

  # Gate 8: the VS Code client must typecheck. It is thin, but a broken client is the
  # first thing most users would meet.
  extension:
    name: vscode extension (tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: editors/vscode/package.json
      - run: npm install --no-audit --no-fund
        working-directory: editors/vscode
      - run: npx tsc -p ./ --noEmit
        working-directory: editors/vscode

  # Gate 9: the WebAssembly module must build, stay under the size ceiling, and actually
  # run. The Rust tests execute on the host, where `SystemTime` exists and `usize` is
  # 64-bit; only running the real module catches a wasm-only failure.
  wasm:
    name: wasm (build, size, run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: Swatinem/rust-cache@v2
      - name: install wasm-bindgen-cli at the pinned version
        run: |
          version=$(cargo tree -p casm-wasm -i wasm-bindgen --depth 0 | head -1 | awk '{print $2}' | tr -d 'v')
          cargo install wasm-bindgen-cli --version "$version" --locked
      - run: ./scripts/build-wasm.sh
      - run: node crates/casm-wasm/tests/node/run.mjs
      - run: node edge/tests/handler.test.mjs

  # Gate 10: the generated specifications must be accepted by the real model checkers,
  # and must still FAIL on an architecture that violates them. A spec that parses and
  # proves nothing would pass every Rust test in the crate.
  formal:
    name: formal (TLC + Alloy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: Swatinem/rust-cache@v2
      - name: fetch the model checkers
        run: |
          mkdir -p "$RUNNER_TEMP/tools"
          curl -sSL -o "$RUNNER_TEMP/tools/tla2tools.jar" \
            https://github.com/tlaplus/tlaplus/releases/latest/download/tla2tools.jar
          curl -sSL -o "$RUNNER_TEMP/tools/alloy.jar" \
            https://github.com/AlloyTools/org.alloytools.alloy/releases/download/v6.2.0/org.alloytools.alloy.dist.jar
      - name: model-check the generated specifications
        env:
          CASM_TLA_TOOLS: ${{ runner.temp }}/tools/tla2tools.jar
          CASM_ALLOY_JAR: ${{ runner.temp }}/tools/alloy.jar
        run: cargo test -p casm-formal --test checked -- --test-threads=2

  # Gate 11: the fuzz targets must build and survive a short run. Not a substitute for a
  # long campaign — that belongs on a schedule — but it catches a target that stopped
  # compiling, and a regression shallow enough to find in a minute.
  fuzz:
    name: fuzz (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-fuzz --locked
      - run: cargo fuzz build
      - name: run each target briefly
        run: |
          for target in parse validate analyse roundtrip; do
            cargo fuzz run "$target" -- -max_total_time=45 -rss_limit_mb=4096
          done

  # Gate 12: the container image must build. It is how a good number of people will run
  # CASIMIR, and a Dockerfile nobody builds is a Dockerfile that has already rotted.
  container:
    name: container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: casm:ci
      # The example claims a pattern, so the pattern library is mounted alongside it.
      # That is not incidental: it proves the image can read a library from a mounted
      # volume, which is how anyone running CASIMIR in a container will supply one.
      - name: the image runs
        run: |
          docker run --rm casm:ci --version
          docker run --rm \
            -v "$PWD/examples:/work" -v "$PWD/patterns:/patterns:ro" \
            casm:ci validate /work/storefront.yaml --patterns /patterns

  # Gate 13: the documentation must build, and every link in it must resolve. A book
  # with a dead link is a book that has silently rotted.
  docs-site:
    name: documentation site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install mdbook mdbook-linkcheck --locked
      - run: mdbook build
        working-directory: docs/book

  # Gate 14: the benchmarks must compile, and the telemetry overhead ceiling must hold.
  #
  # Not a gate on absolute timings. A shared runner's throughput varies by more than any
  # regression worth catching, so a threshold tight enough to be useful would fail
  # constantly. What is asserted is a *ratio* — the cost of a span against the cost of the
  # operation it wraps — which survives a slow machine, and the fact that every benchmark
  # still builds, which is what actually rots.
  bench:
    name: benchmarks (build + overhead)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench --workspace --no-run
      - name: telemetry stays under the roadmap's 5% ceiling
        run: cargo test -p casm-telemetry --release --test overhead

  # Gate 15: CASIMIR validates its own example architectures. If the tool cannot keep
  # If the tool cannot keep its own house in order, it has no business auditing anyone else's.
  dogfood:
    name: dogfood (casm check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -p casm-cli -- check examples --strict --patterns patterns
      # The example claims conformance to the example pattern, so `evolve` reporting
      # anything unmet means one of the two drifted from the other.
      - run: cargo run -p casm-cli -- evolve examples/storefront.yaml --patterns patterns --strict
      # The evidence register must assemble for the example. `--no-history` because the
      # checkout is shallow, so provenance would be missing rather than wrong.
      - run: cargo run -p casm-cli -- evidence examples/storefront.yaml --patterns patterns --no-history
