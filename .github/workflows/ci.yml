name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Sunday, 03:00 UTC. Two jobs are too slow to run per push and too valuable to skip: a
  # long fuzz campaign, and a mutation sweep. Both are guarded on the event so an ordinary
  # push does not pay for them.
  schedule:
    - cron: "0 3 * * 0"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Gate 1: formatting. Cheap, so it runs first and fails fast.
  format:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # Gate 2: NASA Rules 2 and 3 — bounded complexity, no panics in libraries.
  # The lint set is declared in the workspace manifest; this makes it fatal.
  clippy:
    name: clippy (-D warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # Gate 3: the test suite, including doctests, on every supported platform.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features

  # Gate 4: the declared MSRV must actually build.
  msrv:
    name: minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-features

  # Gate 5: NASA Rule 1. Every crate is `#![forbid(unsafe_code)]`, so the compiler already
  # guarantees CASIMIR contains none; what Miri adds is detecting undefined behaviour
  # reached *through dependencies* — `uuid`, `sha3`, `indexmap`, and `serde` all have
  # unsafe internals.
  #
  # Scoped to `casm-core`: it is where those primitives are exercised, and Miri runs
  # roughly a hundred times slower than native, so the whole workspace would take longer
  # than every other gate combined.
  miri:
    name: miri (undefined behaviour)
    runs-on: ubuntu-latest
    env:
      # Isolation blocks `getcwd`, which `proptest` calls to locate its regression file.
      # Miri is being used here to find UB, not to sandbox.
      MIRIFLAGS: -Zmiri-disable-isolation
      # 256 cases per property is right for a native run and disproportionate under Miri.
      PROPTEST_CASES: 4
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      - run: cargo miri test -p casm-core --lib

  # Gate 6: supply chain — licences, advisories, and duplicate dependencies.
  deny:
    name: cargo-deny (licences + advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # Gate 7: documentation must build with no broken intra-doc links.
  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --all-features

  # Gate 8: the VS Code client must typecheck. It is thin, but a broken client is the
  # first thing most users would meet.
  extension:
    name: vscode extension (tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: editors/vscode/package.json
      - run: npm install --no-audit --no-fund
        working-directory: editors/vscode
      - run: npx tsc -p ./ --noEmit
        working-directory: editors/vscode

  # Gate 9: the WebAssembly module must build, stay under the size ceiling, and actually
  # run. The Rust tests execute on the host, where `SystemTime` exists and `usize` is
  # 64-bit; only running the real module catches a wasm-only failure.
  wasm:
    name: wasm (build, size, run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: Swatinem/rust-cache@v2
      - name: install wasm-bindgen-cli at the pinned version
        run: |
          version=$(cargo tree -p casm-wasm -i wasm-bindgen --depth 0 | head -1 | awk '{print $2}' | tr -d 'v')
          cargo install wasm-bindgen-cli --version "$version" --locked
      - run: ./scripts/build-wasm.sh
      - run: node crates/casm-wasm/tests/node/run.mjs
      - run: node edge/tests/handler.test.mjs

  # Gate 10: the generated specifications must be accepted by the real model checkers,
  # and must still FAIL on an architecture that violates them. A spec that parses and
  # proves nothing would pass every Rust test in the crate.
  formal:
    name: formal (TLC + Alloy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: Swatinem/rust-cache@v2
      - name: fetch the model checkers
        run: |
          mkdir -p "$RUNNER_TEMP/tools"
          curl -sSL -o "$RUNNER_TEMP/tools/tla2tools.jar" \
            https://github.com/tlaplus/tlaplus/releases/latest/download/tla2tools.jar
          curl -sSL -o "$RUNNER_TEMP/tools/alloy.jar" \
            https://github.com/AlloyTools/org.alloytools.alloy/releases/download/v6.2.0/org.alloytools.alloy.dist.jar
      - name: model-check the generated specifications
        env:
          CASM_TLA_TOOLS: ${{ runner.temp }}/tools/tla2tools.jar
          CASM_ALLOY_JAR: ${{ runner.temp }}/tools/alloy.jar
        run: cargo test -p casm-formal --test checked -- --test-threads=2

  # Gate 11: the fuzz targets must build and survive a short run. It catches a target that
  # stopped compiling, and a regression shallow enough to find in a minute. The long
  # campaign it is not a substitute for runs weekly, below — for most of this project's
  # life that sentence described a schedule that did not exist.
  fuzz:
    name: fuzz (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-fuzz --locked
      - run: cargo fuzz build
      - name: run each target briefly
        run: |
          for target in parse validate analyse roundtrip; do
            cargo fuzz run "$target" -- -max_total_time=45 -rss_limit_mb=4096
          done

  # Gate 12: the container image must build. It is how a good number of people will run
  # CASIMIR, and a Dockerfile nobody builds is a Dockerfile that has already rotted.
  container:
    name: container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: casm:ci
      # The example claims a pattern, so the pattern library is mounted alongside it.
      # That is not incidental: it proves the image can read a library from a mounted
      # volume, which is how anyone running CASIMIR in a container will supply one.
      - name: the image runs
        run: |
          docker run --rm casm:ci --version
          docker run --rm \
            -v "$PWD/examples:/work" -v "$PWD/patterns:/patterns:ro" \
            casm:ci validate /work/storefront.yaml --patterns /patterns

  # Gate 13: the documentation must build, and every link in it must resolve. A book
  # with a dead link is a book that has silently rotted.
  docs-site:
    name: documentation site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install mdbook mdbook-linkcheck --locked
      - run: mdbook build
        working-directory: docs/book

  # Gate 14: the benchmarks must compile, and the telemetry overhead ceiling must hold.
  #
  # Not a gate on absolute timings. A shared runner's throughput varies by more than any
  # regression worth catching, so a threshold tight enough to be useful would fail
  # constantly. What is asserted is a *ratio* — the cost of a span against the cost of the
  # operation it wraps — which survives a slow machine, and the fact that every benchmark
  # still builds, which is what actually rots.
  bench:
    name: benchmarks (build + overhead)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench --workspace --no-run
      - name: telemetry stays under the roadmap's 5% ceiling
        run: cargo test -p casm-telemetry --release --test overhead

  # Gate 15: the OTLP output must be accepted by a real collector.
  #
  # `casm-telemetry` encodes OTLP by hand rather than through the SDK, so its unit tests
  # can only assert the shape against the specification's field names. That cannot catch an
  # encoding a collector refuses — and a 200 alone would not either, because an OTLP
  # receiver ignores unknown fields and decodes a wholly wrong payload to an empty request.
  # The script therefore compares the collector's own counters against what was sent.
  otlp:
    name: otlp (real collector)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/verify-otlp.sh

  # Gate 16: the bills of materials must actually be produced.
  #
  # This exists because they were not. v0.1.0 and v0.2.0 shipped with no CycloneDX SBOM:
  # the release step looked for a filename `cargo cyclonedx` does not write and hid the
  # miss behind `|| true`. Nothing noticed, because the release workflow only runs on a
  # tag — so the same generation runs here, on every push, where a regression is visible
  # the day it lands rather than at the next release.
  sbom:
    name: bills of materials
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-cyclonedx cargo-sbom --locked
      - name: generate
        run: |
          set -euo pipefail
          mkdir -p dist
          cargo cyclonedx --format json --all --override-filename bom
          cp crates/casm-cli/bom.json dist/casm-cli-cyclonedx.json
          cp crates/casm-lsp/bom.json dist/casm-lsp-cyclonedx.json
          find . -name 'bom.json' -not -path './target/*' -delete
          cargo sbom --output-format spdx_json_2_3 > dist/casm-spdx.json
      - name: every document must exist, parse, and describe what ships
        run: |
          set -euo pipefail
          for file in dist/casm-cli-cyclonedx.json \
                      dist/casm-lsp-cyclonedx.json \
                      dist/casm-spdx.json; do
            test -s "$file" || { echo "error: $file is missing or empty" >&2; exit 1; }
            python3 -c 'import json,sys; json.load(open(sys.argv[1]))' "$file"
            echo "  ok   $file ($(wc -c <"$file") bytes)"
          done
          # A document that parses but describes the wrong package would pass every check
          # above. Every workspace crate the binary links must appear in its bill.
          python3 - <<'PYTHON'
          import json
          import sys

          expected = {
              "dist/casm-cli-cyclonedx.json": ("casm-cli", ["casm-core", "casm-evidence", "casm-telemetry"]),
              "dist/casm-lsp-cyclonedx.json": ("casm-lsp", ["casm-core", "casm-parser", "casm-validator"]),
          }

          failed = False
          for path, (described, required) in expected.items():
              document = json.load(open(path, encoding="utf-8"))
              subject = document.get("metadata", {}).get("component", {}).get("name")
              names = {component["name"] for component in document.get("components", [])}

              problems = []
              if subject != described:
                  problems.append(f"describes {subject!r}, expected {described!r}")
              problems.extend(f"does not list {crate}" for crate in required if crate not in names)

              if problems:
                  failed = True
                  for problem in problems:
                      print(f"  FAIL {path} {problem}")
              else:
                  print(f"  ok   {path} describes {subject} with {len(names)} components")

          sys.exit(1 if failed else 0)
          PYTHON

  # The long fuzz campaign the smoke test is not a substitute for. Weekly, an hour per
  # target, seeded from the corpus in `fuzz/seeds`.
  fuzz-campaign:
    name: fuzz (campaign, weekly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-fuzz --locked
      - run: cargo fuzz build
      - name: run each target for an hour
        run: |
          set -euo pipefail
          for target in parse validate analyse roundtrip; do
            cargo fuzz run "$target" -- -max_total_time=3600 -rss_limit_mb=4096
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore

  # Gate 17: mutation testing, weekly.
  #
  # Four bugs in one day were checks that could not fail — a benchmark assertion in a
  # target `cargo test` never runs, an OTLP check reading a meaningless 200, an SBOM step
  # behind `|| true`, a checksum manifest that could ship partial. Each was found by hand.
  # This finds that class mechanically, by changing the code and reporting which changes no
  # test objects to.
  #
  # Weekly rather than per-push: a full sweep is 1,700 mutants and roughly forty minutes,
  # which is not a price worth paying on every commit. It does not gate a merge — it opens
  # a conversation about a test that is not testing.
  mutants:
    name: mutation testing (weekly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-mutants --locked
      - name: sweep
        run: cargo mutants -j 4 --in-place --no-shuffle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants-report
          path: mutants.out/
          if-no-files-found: warn

  # Gate 17: CASIMIR validates its own example architectures. If the tool cannot keep
  # If the tool cannot keep its own house in order, it has no business auditing anyone else's.
  dogfood:
    name: dogfood (casm check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -p casm-cli -- check examples --strict --patterns patterns
      # The example claims conformance to the example pattern, so `evolve` reporting
      # anything unmet means one of the two drifted from the other.
      - run: cargo run -p casm-cli -- evolve examples/storefront.yaml --patterns patterns --strict
      # The evidence register must assemble for the example. `--no-history` because the
      # checkout is shallow, so provenance would be missing rather than wrong.
      - run: cargo run -p casm-cli -- evidence examples/storefront.yaml --patterns patterns --no-history
