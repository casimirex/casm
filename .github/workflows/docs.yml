name: Documentation

# Builds the book on every change, and publishes it to GitHub Pages when that is
# possible. Pages is unavailable for a private repository on a free plan, so the publish
# steps are guarded rather than left to fail on every push — a workflow that is always red
# teaches people to ignore the red.
#
# Make the repository public and the deploy begins working with no change here.
on:
  push:
    branches: [main]
    paths: ["docs/book/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build the book
    runs-on: ubuntu-latest
    outputs:
      publishable: ${{ steps.visibility.outputs.public }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install mdbook --locked
      - run: mdbook build
        working-directory: docs/book

      - id: visibility
        run: echo "public=${{ github.event.repository.private == false }}" >> "$GITHUB_OUTPUT"

      - uses: actions/configure-pages@v5
        if: steps.visibility.outputs.public == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.visibility.outputs.public == 'true'
        with:
          path: docs/book/book

      - name: note why publishing was skipped
        if: steps.visibility.outputs.public != 'true'
        run: |
          echo "The book built successfully but was not published." >> "$GITHUB_STEP_SUMMARY"
          echo "GitHub Pages needs a public repository on this plan." >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: build
    if: needs.build.outputs.publishable == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
