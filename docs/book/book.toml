[book]
title = "CASM"
description = "Architecture as code, validated like flight software."
authors = ["CASM Engineering"]
language = "en"
src = "src"

[output.html]
default-theme = "rust"
preferred-dark-theme = "ayu"
git-repository-url = "https://github.com/casimirex/casm"
edit-url-template = "https://github.com/casimirex/casm/edit/main/docs/book/{path}"
additional-css = ["theme/casm.css"]

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
