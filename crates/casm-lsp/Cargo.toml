[package]
name = "casm-lsp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "CASM language server: completion, diagnostics, hover, and quick-fixes for architecture files"
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "casm-lsp"
path = "src/main.rs"
required-features = ["server"]

[features]
default = ["server"]
# The JSON-RPC layer, and the async runtime it needs. Off, the crate is pure analysis
# with no `tokio` — which is what `casm-wasm` depends on, since a browser has neither a
# socket nor a reason to carry a multi-threaded runtime.
server = ["dep:tower-lsp-server", "dep:tokio"]

[dependencies]
casm-core.workspace = true
casm-parser.workspace = true
casm-validator.workspace = true
casm-renderer.workspace = true
serde_json.workspace = true
tower-lsp-server = { version = "0.23", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "io-std", "macros"], optional = true }

[dev-dependencies]
serde.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "time"] }

[lints]
workspace = true
