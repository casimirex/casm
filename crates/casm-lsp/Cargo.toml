[package]
name = "casm-lsp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "CASIMIR language server: completion, diagnostics, hover, and quick-fixes for architecture files"
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "casm-lsp"
path = "src/main.rs"

[dependencies]
casm-core.workspace = true
casm-parser.workspace = true
casm-validator.workspace = true
casm-renderer.workspace = true
serde_json.workspace = true
tower-lsp-server = "0.23"
tokio = { version = "1", features = ["rt-multi-thread", "io-std", "macros"] }

[dev-dependencies]
serde.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "time"] }

[lints]
workspace = true
