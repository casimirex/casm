[package]
name = "casm-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
casm-core = { path = "../crates/casm-core" }
casm-parser = { path = "../crates/casm-parser" }
casm-validator = { path = "../crates/casm-validator" }
casm-renderer = { path = "../crates/casm-renderer" }
casm-lsp = { path = "../crates/casm-lsp", default-features = false }
casm-formal = { path = "../crates/casm-formal" }
casm-diff = { path = "../crates/casm-diff" }

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "validate"
path = "fuzz_targets/validate.rs"
test = false
doc = false
bench = false

[[bin]]
name = "analyse"
path = "fuzz_targets/analyse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "roundtrip"
path = "fuzz_targets/roundtrip.rs"
test = false
doc = false
bench = false
